<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>Traição Espacial</title>
    <meta name="theme-color" content="#03050b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="menu" class="scr">
        <h1>Traição<br><span>Espacial</span></h1>
        <p class="tag">// PC · CELULAR · TABLET — JOGUE JUNTO ONLINE //</p>
        <input id="nome" placeholder="Seu nome" maxlength="10">
        <button id="bOn">Modo Online</button><button id="bLo">Modo Local</button>
    </div>

    <div id="online" class="scr hide">
        <h2>Modo Online</h2>
        <button id="bCria">Criar sala</button>
        <div class="row"><input id="cod" placeholder="CÓDIGO" maxlength="4"><button id="bEnt">Entrar</button></div>
        <p id="msg"></p><button class="v">Voltar</button>
    </div>

    <div id="local" class="scr hide">
        <h2>Modo Local</h2>
        <p>Você + bots: <b id="njv">6</b> jogadores</p>
        <input type="range" id="nj" min="3" max="12" value="6">
        <button id="bIni">Jogar</button><button class="v">Voltar</button>
    </div>

    <div id="lobby" class="scr hide">
        <h2>Sala <b id="lc"></b></h2>
        <div id="ll"></div>
        <div id="imw" class="row hide" style="align-items:center"><span>Impostores</span><button id="imm">−</button><b
                id="imn" style="font-size:1.4em;color:var(--m)">1</b><button id="imp">+</button></div>
        <button id="bBot" class="hide">+ Bot</button><button id="bGo" class="hide">Iniciar (mín. 3)</button>
        <p id="lw">Aguardando o anfitrião...</p>
    </div>

    <canvas id="cv"></canvas>
    <div id="hud" class="hide">
        <div id="barw"><i id="bar"></i><span>TAREFAS CONCLUÍDAS</span></div>
        <div id="sabbar" class="hide"></div>
        <div id="acts"><button id="bUse">USAR</button><button id="bRep">REPORTAR</button>
            <button id="bKill" class="hide">MATAR</button><button id="bSab" class="hide">SABOTAR</button>
        </div>
    </div>

    <div id="task" class="ov hide">
        <div>
            <p>Toque os números em ordem</p>
            <div id="tg"></div><button id="tx">Fechar</button>
        </div>
    </div>
    <div id="sabm" class="ov hide">
        <p>Escolha a sabotagem</p><button data-k="luz">Luzes</button><button data-k="o2">Oxigênio</button><button
            data-k="esc">Escudos</button><button id="sabx">Cancelar</button>
    </div>
    <div id="role" class="ov hide">
        <h1 id="rt"></h1>
        <p id="rp"></p>
    </div>

    <div id="meet" class="ov hide">
        <div class="mbox">
            <h2 id="mh"></h2>
            <h3 id="mt"></h3>
            <div id="cards"></div>
            <button id="skip">Pular voto</button>
            <div id="chat"></div><input id="ci" placeholder="Mensagem..." maxlength="60">
        </div>
    </div>

    <div id="end" class="ov hide">
        <h1 id="et"></h1><button onclick="location.reload()">Menu</button>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
